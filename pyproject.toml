[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dualref"
version = "0.1.0"
description = "Dual-reference offline optimization for adaptive vision-language reasoning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.8,<2.9", "torchvision>=0.23,<0.24",
  "transformers==4.57.1", "peft==0.17.1", "accelerate==1.10.1",
  "datasets==4.2.0", "huggingface-hub>=0.35,<1",
  "pillow>=11,<12", "numpy>=2,<3", "scipy>=1.14,<2",
  "matplotlib>=3.9,<4", "safetensors>=0.6,<1", "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
dualref = "dualref.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dualref"]

[tool.hatch.build.targets.wheel.force-include]
configs = "dualref/configs"

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
